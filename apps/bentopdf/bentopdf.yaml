# =========================
# DEPLOYMENT - bentopdf
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bentopdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bentopdf
  template:
    metadata:
      labels:
        app: bentopdf
    spec:
      containers:
        - name: bentopdf
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
          image: ghcr.io/alam00000/bentopdf:latest
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

---
# =========================
# SERVICE - bentopdf
# =========================
apiVersion: v1
kind: Service
metadata:
  name: bentopdf
spec:
  type: ClusterIP
  selector:
    app: bentopdf
  ports:
    - port: 8080
      targetPort: 8080

---
# =========================
# INGRESS - bentopdf
# =========================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bentopdf
  namespace: default
spec:
  rules:
  - host: pdf.kacperjedynak.pl
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bentopdf
            port:
              number: 8080

