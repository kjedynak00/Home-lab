# =========================
# PVC
# =========================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beszel-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  volumeName: pvc-6bc46bdf-cc21-4f19-83f2-08d1a0555f96
  resources:
    requests:
      storage: 5Gi

---
# =========================
# DEPLOYMENT
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beszel
  labels:
    app: beszel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beszel
  template:
    metadata:
      labels:
        app: beszel
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: beszel
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
          image: henrygd/beszel:latest
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: APP_URL
              value: "https://beszel.kacperjedynak.pl"
            - name: HEARTBEAT_URL
              value: "https://hc-ping.com/1c50ee02-df44-40f6-892f-db84d343496f"
            - name: HEARTBEAT_INTERVAL
              value: "60"
            - name: HEARTBEAT_METHOD
              value: "POST"
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - mountPath: /beszel_data
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: beszel-data

---
# =========================
# SERVICE
# =========================
apiVersion: v1
kind: Service
metadata:
  name: beszel-svc
spec:
  selector:
    app: beszel
  ports:
    - port: 80
      targetPort: 8090
  type: ClusterIP

---
# =========================
# INGRESS
# =========================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beszel
  namespace: default
spec:
  rules:
  - host: beszel.kacperjedynak.pl
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: beszel-svc
            port:
              number: 80

---
# =========================
# AGENT (DaemonSet)
# =========================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: beszel-agent
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 100%
  selector:
    matchLabels:
      app: beszel-agent
  template:
    metadata:
      labels:
        app: beszel-agent
    spec:
      hostNetwork: true
      containers:
        - name: beszel-agent
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_PTRACE"]
            allowPrivilegeEscalation: true
          image: henrygd/beszel-agent:latest
          imagePullPolicy: Always
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: HUB_URL
              value: "https://beszel.kacperjedynak.pl"
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: beszel-secret
                  key: TOKEN
            - name: KEY
              valueFrom:
                secretKeyRef:
                  name: beszel-secret
                  key: KEY
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
