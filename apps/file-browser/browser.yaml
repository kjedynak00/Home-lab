# =========================
# PV - FILES (SYNOLOGY NAS, NFS)
# =========================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: filebrowser-nfs-pv
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.0
  nfs:
    server: 192.168.100.91
    path: /volume1/NAS/home-lab/data/filebrowser
---
# =========================
# PVC - FILES (SYNOLOGY NAS)
# =========================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filebrowser-pvc-nfs
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: filebrowser-nfs-pv
  resources:
    requests:
      storage: 500Gi
---
# =========================
# PVC - DATABASE (LONGHORN, covered by nightly Longhorn backup)
# =========================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filebrowser-pvc-longhorn
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
# =========================
# DEPLOYMENT
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: filebrowser
          image: filebrowser/filebrowser:latest
          args:
            - --address
            - "0.0.0.0"
            - --port
            - "8080"
            - --root
            - /srv
            - --database
            - /database/filebrowser.db
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # = "kacper" on the NAS, files keep the right owner
            runAsGroup: 100
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: Europe/Warsaw
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: filebrowser-files
              mountPath: /srv
            - name: filebrowser-database
              mountPath: /database
      volumes:
        - name: filebrowser-files
          persistentVolumeClaim:
            claimName: filebrowser-pvc-nfs
        - name: filebrowser-database
          persistentVolumeClaim:
            claimName: filebrowser-pvc-longhorn
---
# =========================
# SERVICE
# =========================
apiVersion: v1
kind: Service
metadata:
  name: filebrowser
spec:
  selector:
    app: filebrowser
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
# =========================
# INGRESS
# =========================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: filebrowser
  namespace: default
spec:
  rules:
    - host: files.kacperjedynak.pl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: filebrowser
                port:
                  number: 80
