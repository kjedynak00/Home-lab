# =========================
# PV - vaultwarden
# =========================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vaultwarden-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: "" 
  hostPath:
    path: /mnt/NAS/home-lab/data/vaultwarden
  persistentVolumeReclaimPolicy: Retain

---
# =========================
# PVC - vaultwarden
# =========================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-pvc
spec:
  accessModes:
    - ReadWriteOnce
  volumeName: vaultwarden-pv
  storageClassName: "" 
  resources:
    requests:
      storage: 5Gi

---
# =========================
# DEPLOYMENT - vaultwarden
# =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      containers:
        - name: vaultwarden
          image: vaultwarden/server:latest
          imagePullPolicy: Always # autoupdate to latest version
          ports:
            - containerPort: 80

          env:
            - name: TZ
              value: Europe/Warsaw

            - name: SIGNUPS_ALLOWED
              value: "false"

            - name: INVITATIONS_ALLOWED
              value: "false"

          livenessProbe:
            httpGet:
              path: /alive
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /alive
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          volumeMounts:
            - name: vaultwarden-data
              mountPath: /data

      volumes:
        - name: vaultwarden-data
          persistentVolumeClaim:
            claimName: vaultwarden-pvc

---
# =========================
# SERVICE - vaultwarden
# =========================
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
spec:
  type: ClusterIP
  selector:
    app: vaultwarden
  ports:
    - port: 80
      targetPort: 80

---
# =========================
# INGRESS - vaultwarden
# =========================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  namespace: default
spec:
  rules:
  - host: vault.kacperjedynak.pl
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vaultwarden
            port:
              number: 80